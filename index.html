<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

  <meta name="twitter:site" content="@KillersArena">
  <meta name="twitter:title" content="KillersArena Mobile">
  <meta name="twitter:description" content="Play KillersArena Mobile instantly on X!">
  <meta name="twitter:image"
    content="https://killersarena-mob-git-twi-ecd168-harshitsiwachgmailcoms-projects.vercel.app/TemplateData/icons/icon-512.png">

  <!-- Player Card Specifics -->

    content="https://killersarena-mob-git-twi-ecd168-harshitsiwachgmailcoms-projects.vercel.app/">
  <meta name="twitter:player:width" content="360">
  <meta name="twitter:player:height" content="640">

  <meta property="og:title" content="KillersArena Mobile">
  <meta property="og:description" content="Play KillersArena Mobile instantly on X!">
  <meta property="og:image"
    content="https://killersarena-mob-git-twi-ecd168-harshitsiwachgmailcoms-projects.vercel.app/TemplateData/icons/icon-512.png">
  <meta property="og:url" content="https://killersarena-mob-git-twi-ecd168-harshitsiwachgmailcoms-projects.vercel.app/">

  <!-- Mobile Standalone Mode -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">

  <title>KillersArena</title>
  <link rel="shortcut icon" href="TemplateData/icons/icon-192.png">
  <link rel="stylesheet" href="TemplateData/style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="192x192" href="TemplateData/icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="TemplateData/icons/icon-512.png">
</head>

<body>
  <div id="unity-container" class="unity-desktop">

    <!-- Orientation Overlay -->
    <div id="orientation-overlay">
      <svg viewBox="0 0 24 24">
        <path
          d="M16.48 2.52c3.27 1.55 5.61 4.72 5.97 8.48h1.5C23.44 4.84 18.29 0 12 0l-1 1v2h1c1.58 0 3.09.84 4.48 2.52zm-12.96 0C2.14 4.14.65 6.46.06 9h1.5c.36-3.76 2.7-6.93 5.97-8.48l1.39-2.52C7.54.84 6.03 0 4.45 0 3.86 0 3.28.16 2.73.43L4.12 3H2.52v-.48zM0 12c0 6.62 5.38 12 12 12s12-5.38 12-12h-1.5c0 5.8-4.7 10.5-10.5 10.5S1.5 17.8 1.5 12H0zm12 5c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" />
      </svg>
      <p>Please Rotate Device</p>
    </div>

    <!-- Tap to Start Overlay (Fullscreen Trigger) -->
    <div id="tap-overlay" onclick="enterFullscreen()">
      <div>Tap to Start</div>
    </div>

    <canvas id="unity-canvas" width=1600 height=900 tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <div id="unity-warning"> </div>
    <div id="unity-footer">
      <div id="unity-logo-title-footer"></div>
      <div id="unity-fullscreen-button"></div>
      <div id="unity-build-title">KillersArena</div>
    </div>
  </div>
  <script>
    var canvas = document.querySelector("#unity-canvas");

    // Shows a temporary message banner/ribbon for a few seconds, or
    // a permanent error message on top of the canvas if type=='error'.
    // If type=='warning', a yellow highlight color is used.
    // Modify or remove this function to customize the visually presented
    // way that non-critical warnings and error messages are presented to the
    // user.
    function unityShowBanner(msg, type) {
      var warningBanner = document.querySelector("#unity-warning");
      function updateBannerVisibility() {
        warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
      }
      var div = document.createElement('div');
      div.innerHTML = msg;
      warningBanner.appendChild(div);
      if (type == 'error') div.style = 'background: red; padding: 10px;';
      else {
        if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
        setTimeout(function () {
          warningBanner.removeChild(div);
          updateBannerVisibility();
        }, 5000);
      }
      updateBannerVisibility();
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/KA_Mob.loader.js";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/KA_Mob.data",
      frameworkUrl: buildUrl + "/KA_Mob.framework.js",
      codeUrl: buildUrl + "/KA_Mob.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "RuptureLabs",
      productName: "KillersArena",
      productVersion: "1.0",
      showBanner: unityShowBanner,
    };
    // By default, Unity keeps WebGL canvas render target size matched with
    // the DOM size of the canvas element (scaled by window.devicePixelRatio)
    // Set this to false if you want to decouple this synchronization from
    // happening inside the engine, and you would instead like to size up
    // the canvas DOM size and WebGL render target sizes yourself.
    // config.matchWebGLToCanvasSize = false;

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      // Mobile device style: fill the whole browser client area with the game canvas:

      var meta = document.createElement('meta');
      meta.name = 'viewport';
      meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
      document.getElementsByTagName('head')[0].appendChild(meta);
      document.querySelector("#unity-container").className = "unity-mobile";
      canvas.className = "unity-mobile";

      // To lower canvas resolution on mobile devices to gain some
      // performance, uncomment the following line:
      // config.devicePixelRatio = 1;


    } else {
      // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:
      canvas.style.width = "1600px";
      canvas.style.height = "900px";
    }

    document.querySelector("#unity-loading-bar").style.display = "block";

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
      }).then((unityInstance) => {
        document.querySelector("#unity-loading-bar").style.display = "none";
        document.querySelector("#unity-fullscreen-button").onclick = () => {
          unityInstance.SetFullscreen(1);
        };

      }).catch((message) => {
        alert(message);
      });
    };

    document.body.appendChild(script);

  </script>
</body>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js');
    });
  }

  function enterFullscreen() {
    var container = document.querySelector("#unity-container");
    var tapOverlay = document.getElementById('tap-overlay');

    tapOverlay.style.display = 'none';

    if (container.requestFullscreen) {
      container.requestFullscreen();
    } else if (container.webkitRequestFullscreen) {
      container.webkitRequestFullscreen();
    } else if (container.msRequestFullscreen) {
      container.msRequestFullscreen();
    }
  }
</script>

</html>
